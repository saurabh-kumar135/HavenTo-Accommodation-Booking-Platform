<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HavenTo AI Agent</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 520px;
      height: 85vh;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }

    .chat-header {
      padding: 20px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chat-header .avatar {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .chat-header .info h2 {
      color: #fff;
      font-size: 17px;
      font-weight: 600;
    }

    .chat-header .info p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      margin-top: 2px;
    }

    .chat-header .status {
      margin-left: auto;
      width: 10px;
      height: 10px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 20px;
      font-size: 14px;
      line-height: 1.6;
      animation: fadeIn 0.3s ease;
      word-wrap: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.bot {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      align-self: flex-start;
      border-bottom-left-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .message.user {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 6px;
    }

    .message.bot strong { color: #a78bfa; }

    .typing {
      align-self: flex-start;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      border-bottom-left-radius: 6px;
      display: flex;
      gap: 5px;
      animation: fadeIn 0.3s ease;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    .chat-input {
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.03);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px 18px;
      color: #fff;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border 0.3s;
    }

    .chat-input input::placeholder { color: rgba(255, 255, 255, 0.3); }
    .chat-input input:focus { border-color: #667eea; }

    .chat-input button {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-input button:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
    .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 14px;
    }

    .suggestions button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #a5b4fc;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestions button:hover {
      background: rgba(102, 126, 234, 0.2);
      border-color: #667eea;
    }

    .message.bot pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🏡</div>
      <div class="info">
        <h2>HavenTo AI</h2>
        <p>Smart Accommodation Assistant</p>
      </div>
      <div class="status"></div>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        Hey there! 👋 I'm <strong>HavenTo AI</strong> — your smart accommodation assistant.<br><br>
        I can help you:<br>
        🔍 <strong>Search homes</strong> by location, price & rating<br>
        🏡 <strong>Get details</strong> about any property<br>
        📅 <strong>Book homes</strong> instantly<br><br>
        Try asking me something!
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button onclick="sendSuggestion('Show me all available homes')">🏠 All homes</button>
      <button onclick="sendSuggestion('Find homes in Mumbai')">🌊 Mumbai</button>
      <button onclick="sendSuggestion('Find homes in Goa under 8000')">🏖️ Goa < ₹8K</button>
      <button onclick="sendSuggestion('Find luxury homes with 9+ rating')">⭐ Luxury</button>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Ask me about accommodations..." autocomplete="off">
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    // Change this to your server URL
    const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3009/api/agent/chat'
      : window.location.origin + '/api/agent/chat';

    const chatHistory = [];
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const suggestionsDiv = document.getElementById('suggestions');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendSuggestion(text) {
      input.value = text;
      sendMessage();
    }

    function addMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      // Convert markdown-like formatting
      let formatted = text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
      msg.innerHTML = formatted;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTyping() {
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.id = 'typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      messagesDiv.appendChild(typing);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideTyping() {
      const typing = document.getElementById('typing');
      if (typing) typing.remove();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // Hide suggestions after first message
      suggestionsDiv.style.display = 'none';

      addMessage(text, 'user');
      input.value = '';
      sendBtn.disabled = true;

      chatHistory.push({ role: 'user', content: text });

      showTyping();

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            chatHistory: chatHistory.slice(-10), // Last 10 messages for context
          }),
        });

        const data = await res.json();
        hideTyping();

        if (data.success) {
          addMessage(data.reply, 'bot');
          chatHistory.push({ role: 'assistant', content: data.reply });
        } else {
          addMessage('⚠️ ' + (data.message || 'Something went wrong'), 'bot');
        }
      } catch (err) {
        hideTyping();
        addMessage('❌ Could not connect to server. Make sure HavenTo is running.', 'bot');
      }

      sendBtn.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
